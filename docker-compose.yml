version: '3.8'

services:
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: conteo_horas
      MYSQL_USER: conteo_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://conteo_user:${DB_PASSWORD}@db:3306/conteo_horas
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://${SERVER_IP}:3001/api

volumes:
  mysql_data:
